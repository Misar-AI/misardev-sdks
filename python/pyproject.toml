[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "misardev"
version = "1.0.0"
description = "Build, ship and run apps on MisarDev from Python: projects, files, builds, deploys, templates, OpenAI-compatible chat, code search, usage and billing — every API route, sync and async, with retries, typed plan-limit errors and SSE streaming."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Misar.AI", email = "hello@misar.io" }]
keywords = [
  "misardev",
  "misar",
  "app-builder",
  "ai-app-builder",
  "deploy",
  "hosting",
  "templates",
  "chat-completions",
  "openai-compatible",
  "code-search",
  "sse",
  "async",
  "api-client",
  "sdk",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: AsyncIO",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://www.misar.dev"
Documentation = "https://docs.misar.io/dev"
Repository = "https://github.com/Misar-AI/misardev-sdks"
Issues = "https://github.com/Misar-AI/misardev-sdks/issues"
Changelog = "https://github.com/Misar-AI/misardev-sdks/blob/main/python/CHANGELOG.md"
"Source (this SDK)" = "https://github.com/Misar-AI/misardev-sdks/tree/main/python"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "build", "twine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["misardev"]

[tool.hatch.build.targets.sdist]
include = ["misardev", "tests", "README.md", "CHANGELOG.md", "LICENSE"]
