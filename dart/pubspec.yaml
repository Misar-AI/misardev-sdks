name: misardev
description: "Build, deploy and chat with your apps from Dart: the MisarDev API with typed plan-limit errors, Retry-After-aware retries, SSE streaming and pagination."
version: 1.0.0
homepage: https://www.misar.dev
repository: https://github.com/Misar-AI/misardev-sdks/tree/main/dart
issue_tracker: https://github.com/Misar-AI/misardev-sdks/issues
documentation: https://docs.misar.io/dev

topics:
  - ai
  - app-builder
  - deployment
  - api-client
  - sse

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  http: ^1.2.0
  http_parser: ^4.0.2

dev_dependencies:
  lints: ">=3.0.0 <7.0.0"
  test: ^1.25.0
